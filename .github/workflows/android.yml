name: Compilar AlpRiders Android

on:
  workflow_dispatch:
  push:
    paths:
      - android-source.zip

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Preparar projeto Android
        run: unzip -q android-source.zip -d android-src

      - name: Compilar APK de teste
        run: cd android-src && gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AlpRiders-CH-Android-debug
          path: android-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
